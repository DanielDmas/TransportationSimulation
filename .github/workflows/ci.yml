name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint (incl. no-bare-stat gate)
        run: npm run lint
      - name: Validate Reality Contract registry
        run: npm run validate:registry
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
